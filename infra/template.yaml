AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: NexusDesk serverless MVP - Lambda Function URL, DynamoDB, S3. No API Gateway, RDS, EC2, EKS, NAT or load balancers.

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
  OpenRouterApiKey:
    Type: String
    NoEcho: true
    Default: ""
  OpenRouterModel:
    Type: String
    Default: openrouter/free
  CorsOrigins:
    Type: String
    Default: http://localhost:3000
  ReservedConcurrency:
    Type: Number
    Default: -1
    Description: >-
      Hard cap on concurrent Lambda executions. Leave at -1 to apply no reservation:
      AWS rejects a reservation unless at least 100 unreserved executions remain, so a
      reservation only works on accounts whose concurrency limit has been raised. On a
      default account the limit itself (10) is the cap.

  ExecutionRoleArn:
    Type: String
    Default: ""
    Description: >-
      Optional existing Lambda execution role. Leave empty to let the stack create one,
      which needs iam:CreateRole. Supply an ARN when the deploying principal may not
      create roles; the role must allow DynamoDB access on the table and read/write on
      the uploads bucket, plus basic Lambda logging.

Conditions:
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, -1]]
  HasExecutionRole: !Not [!Equals [!Ref ExecutionRoleArn, ""]]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Architectures: [arm64]

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  Uploads:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-uploads-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw-uploads
            Status: Enabled
            ExpirationInDays: 365

  Api:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-api
      CodeUri: ../backend
      Handler: app.lambda_handler.handler
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref "AWS::NoValue"]
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowHeaders: ["authorization", "content-type"]
          AllowMethods: ["GET", "POST", "PATCH"]
      Environment:
        Variables:
          ENVIRONMENT: production
          DYNAMODB_TABLE: !Ref Table
          UPLOADS_BUCKET: !Ref Uploads
          JWT_SECRET: !Ref JwtSecret
          OPENROUTER_API_KEY: !Ref OpenRouterApiKey
          OPENROUTER_MODEL: !Ref OpenRouterModel
          CORS_ORIGINS: !Ref CorsOrigins
      Role: !If [HasExecutionRole, !Ref ExecutionRoleArn, !Ref "AWS::NoValue"]
      Policies: !If
        - HasExecutionRole
        - !Ref "AWS::NoValue"
        - - DynamoDBCrudPolicy:
              TableName: !Ref Table
          - S3CrudPolicy:
              BucketName: !Sub ${AWS::StackName}-uploads-${AWS::AccountId}

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: 7

Outputs:
  FunctionUrl:
    Description: Public HTTPS endpoint for the API
    Value: !GetAtt ApiUrl.FunctionUrl
  TableName:
    Value: !Ref Table
  UploadsBucket:
    Value: !Ref Uploads
