[project]
name = "nexusdesk-api"
version = "0.1.0"
description = "FastAPI backend for NexusDesk"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "chromadb>=0.5,<1",
  "fastapi>=0.115,<1",
  "langgraph>=0.2,<1",
  "openai>=1.40,<2",
  "passlib[bcrypt]>=1.7,<2",
  "bcrypt>=4.0,<4.1",
  "email-validator>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.4,<3",
  "pypdf>=5,<6",
  "python-jose[cryptography]>=3.3,<4",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["B008", "BLE001", "S110"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
